server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /

spring:
  application:
    name: sellersprite-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  ai:
    tools:
      throw-exception-on-error: true
  main:
    banner-mode: console
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.yuanbaomao.sellersprite.db.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

ybm:
  mybatis:
    mapper:
      base-packages:
        - com.yuanbaomao.sellersprite.db.mapper
  cache:
    type: local
    key-prefix: sellersprite
  log:
    max-payload-length: 4000

sellersprite:
  api:
    enabled: true
    base-url: https://api.sellersprite.com
    secret-key: ${SELLERSPRITE_API_SECRET_KEY:}
    connect-timeout: 20s
    read-timeout: 60s
