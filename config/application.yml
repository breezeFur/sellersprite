server:
  # 后端 HTTP 监听端口；本地启动时可用 SERVER_PORT 覆盖。
  port: ${SERVER_PORT:8092}

spring:
  application:
    # Spring 应用名，用于日志、监控和服务标识。
    name: sellersprite-service
  profiles:
    # 默认加载本机开发配置；部署环境应显式指定对应 Profile。
    active: ${SPRING_PROFILES_ACTIVE:local}
  ai:
    openai:
      # 单次模型请求超时；长报告分析允许最多等待 300 秒。
      timeout: ${SPRING_AI_OPENAI_TIMEOUT:300s}
      # 模型请求发生可重试错误时的最大重试次数。
      max-retries: ${SPRING_AI_OPENAI_MAX_RETRIES:3}
    tools:
      # 工具调用失败时抛出异常，避免模型把失败结果当作成功数据继续分析。
      throw-exception-on-error: true
  jackson:
    # JSON 日期时间统一按上海时区序列化和反序列化。
    time-zone: Asia/Shanghai
    # JSON 不输出 null 字段，减少接口与事件载荷体积。
    default-property-inclusion: non_null

mybatis-plus:
  # MyBatis XML Mapper 的统一扫描路径。
  mapper-locations: classpath*:/mapper/**/*.xml
  # 数据库实体别名所在包，供 XML Mapper 使用短类名。
  type-aliases-package: cyou.yuanbaomao.sellersprite.db.entity
  configuration:
    # 将数据库 snake_case 列名自动映射为 Java camelCase 字段名。
    map-underscore-to-camel-case: true
    # 禁用 MyBatis 二级缓存，数据库始终作为业务持久化事实源。
    cache-enabled: false
  global-config:
    # 关闭 MyBatis-Plus 启动 Banner，减少无关日志。
    banner: false
    db-config:
      # 所有逻辑删除实体统一使用 deleted 字段。
      logic-delete-field: deleted
      # deleted=1 表示已逻辑删除。
      logic-delete-value: 1
      # deleted=0 表示正常数据。
      logic-not-delete-value: 0

ybm:
  mybatis:
    mapper:
      base-packages:
        # 扫描项目数据库 Mapper 接口。
        - cyou.yuanbaomao.sellersprite.db.mapper
  cache:
    # 框架通用缓存默认使用进程内实现；local Profile 可按环境覆盖为 Redis。
    type: local
    # 框架通用缓存键前缀；与 SellerSprite 外部响应缓存不是同一套键。
    key-prefix: sellersprite
  log:
    # 单条请求或响应日志最多记录 4000 个字符，避免大 JSON 刷屏。
    max-payload-length: 4000

sellersprite:
  research:
    # 市场调研采集数据源：REMOTE 调真实 SellerSprite，MOCK 读取本地样例。
    source-mode: ${SELLERSPRITE_RESEARCH_SOURCE_MODE:REMOTE}
    source-cache:
      # 是否启用 SellerSprite Redis 响应缓存；关闭后完全绕过 Redis 并直接回源。
      enabled: ${SELLERSPRITE_RESEARCH_SOURCE_CACHE_ENABLED:true}
    analysis:
      # 是否启用采集完成后的 AI 分析 Dispatcher 和分析运行。
      enabled: ${SELLERSPRITE_RESEARCH_ANALYSIS_ENABLED:true}
  api:
    # SellerSprite API 密钥，只从环境变量注入，禁止写入仓库。
    secret-key: ${SELLERSPRITE_API_SECRET_KEY:}
    # 建立 SellerSprite 网络连接的最长等待时间。
    connect-timeout: 20s
    # 读取 SellerSprite 完整响应的最长等待时间。
    read-timeout: 60s
